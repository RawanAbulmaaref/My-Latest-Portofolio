<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="pcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#142434"/>
    </linearGradient>
    <linearGradient id="pcAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#pcBg)"/>

  <!-- Browser Header -->
  <rect width="600" height="42" fill="#111827" rx="16"/>
  <circle cx="28" cy="21" r="5.5" fill="#EF4444"/>
  <circle cx="46" cy="21" r="5.5" fill="#F59E0B"/>
  <circle cx="64" cy="21" r="5.5" fill="#10B981"/>
  <rect x="100" y="11" width="340" height="20" rx="10" fill="#1F2937"/>
  <text x="120" y="25" fill="#9CA3AF" font-family="sans-serif" font-size="11">https://petcare-portal.preview/dashboard</text>

  <!-- Hero Banner inside Mock -->
  <rect x="35" y="60" width="530" height="90" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="60" y="96" fill="#F9FAFB" font-family="sans-serif" font-size="18" font-weight="bold">🐾 Care For Your Beloved Pets</text>
  <text x="60" y="122" fill="#94A3B8" font-family="sans-serif" font-size="12">Grooming, Veterinary Care &amp; Health Records powered by .NET Core</text>
  <rect x="420" y="85" width="125" height="36" rx="8" fill="url(#pcAccent)"/>
  <text x="482" y="108" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Book Checkup</text>

  <!-- Service Cards Grid inside Mock -->
  <g transform="translate(35, 165)">
    <!-- Card 1 -->
    <rect width="165" height="110" rx="10" fill="#111827" stroke="#10B981" stroke-width="1.2"/>
    <text x="20" y="35" font-size="22">🩺</text>
    <text x="20" y="65" fill="#F3F4F6" font-family="sans-serif" font-size="13" font-weight="bold">Veterinary Clinic</text>
    <text x="20" y="86" fill="#9CA3AF" font-family="sans-serif" font-size="11">Regular checkups &amp; shots</text>

    <!-- Card 2 -->
    <rect x="182" width="165" height="110" rx="10" fill="#111827" stroke="#1F2937" stroke-width="1.2"/>
    <text x="202" y="35" font-size="22">✂️</text>
    <text x="202" y="65" fill="#F3F4F6" font-family="sans-serif" font-size="13" font-weight="bold">Pet Grooming</text>
    <text x="202" y="86" fill="#9CA3AF" font-family="sans-serif" font-size="11">Baths, styling &amp; hygiene</text>

    <!-- Card 3 -->
    <rect x="365" width="165" height="110" rx="10" fill="#111827" stroke="#1F2937" stroke-width="1.2"/>
    <text x="385" y="35" font-size="22">📋</text>
    <text x="385" y="65" fill="#F3F4F6" font-family="sans-serif" font-size="13" font-weight="bold">Digital Records</text>
    <text x="385" y="86" fill="#9CA3AF" font-family="sans-serif" font-size="11">Vaccine history &amp; diet</text>
  </g>

  <!-- Bottom quick status -->
  <g transform="translate(35, 292)">
    <rect width="530" height="42" rx="8" fill="#13222E"/>
    <circle cx="25" cy="21" r="6" fill="#10B981"/>
    <text x="42" y="26" fill="#6EE7B7" font-family="sans-serif" font-size="12" font-weight="600">Active Patient Appointments: 18 Today</text>
    <text x="430" y="26" fill="#94A3B8" font-family="sans-serif" font-size="12">ASP.NET Core API</text>
  </g>
</svg>
