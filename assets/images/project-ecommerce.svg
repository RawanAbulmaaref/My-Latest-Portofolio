<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="ecBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#2E1065"/>
    </linearGradient>
    <linearGradient id="ecAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#ecBg)"/>

  <!-- Browser Header -->
  <rect width="600" height="42" fill="#111827" rx="16"/>
  <circle cx="28" cy="21" r="5.5" fill="#EF4444"/>
  <circle cx="46" cy="21" r="5.5" fill="#F59E0B"/>
  <circle cx="64" cy="21" r="5.5" fill="#10B981"/>
  <rect x="100" y="11" width="340" height="20" rx="10" fill="#1F2937"/>
  <text x="120" y="25" fill="#9CA3AF" font-family="sans-serif" font-size="11">https://modernstore.preview/products</text>
  <circle cx="550" cy="21" r="12" fill="#374151"/>
  <text x="550" y="25" fill="#FFFFFF" font-family="sans-serif" font-size="11" text-anchor="middle">🛒 3</text>

  <!-- Categories Bar -->
  <g transform="translate(35, 58)">
    <rect width="80" height="28" rx="14" fill="url(#ecAccent)"/>
    <text x="40" y="19" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">All Items</text>

    <rect x="90" width="95" height="28" rx="14" fill="#1F2937"/>
    <text x="137" y="19" fill="#9CA3AF" font-family="sans-serif" font-size="11" text-anchor="middle">Electronics</text>

    <rect x="195" width="85" height="28" rx="14" fill="#1F2937"/>
    <text x="237" y="19" fill="#9CA3AF" font-family="sans-serif" font-size="11" text-anchor="middle">Fashion</text>

    <rect x="290" width="85" height="28" rx="14" fill="#1F2937"/>
    <text x="332" y="19" fill="#9CA3AF" font-family="sans-serif" font-size="11" text-anchor="middle">Gadgets</text>
  </g>

  <!-- Products Grid -->
  <g transform="translate(35, 102)">
    <!-- Product 1 -->
    <rect width="165" height="175" rx="10" fill="#111827" stroke="#374151" stroke-width="1"/>
    <rect x="10" y="10" width="145" height="85" rx="8" fill="#1F2937"/>
    <text x="82" y="60" font-size="34" text-anchor="middle">🎧</text>
    <text x="12" y="116" fill="#F3F4F6" font-family="sans-serif" font-size="12" font-weight="bold">Pro Wireless Headset</text>
    <text x="12" y="136" fill="#F472B6" font-family="sans-serif" font-size="13" font-weight="bold">$129.99</text>
    <rect x="12" y="145" width="141" height="22" rx="4" fill="#7C5CFC"/>
    <text x="82" y="160" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Add to Cart</text>

    <!-- Product 2 -->
    <rect x="182" width="165" height="175" rx="10" fill="#111827" stroke="#4C1D95" stroke-width="1.5"/>
    <rect x="192" y="10" width="145" height="85" rx="8" fill="#1F2937"/>
    <text x="264" y="60" font-size="34" text-anchor="middle">⌚</text>
    <rect x="280" y="14" width="50" height="18" rx="4" fill="#EF4444"/>
    <text x="305" y="27" fill="#FFFFFF" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">-25%</text>
    <text x="194" y="116" fill="#F3F4F6" font-family="sans-serif" font-size="12" font-weight="bold">Smart Fitness Watch</text>
    <text x="194" y="136" fill="#F472B6" font-family="sans-serif" font-size="13" font-weight="bold">$89.50</text>
    <rect x="194" y="145" width="141" height="22" rx="4" fill="#7C5CFC"/>
    <text x="264" y="160" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Add to Cart</text>

    <!-- Product 3 -->
    <rect x="365" width="165" height="175" rx="10" fill="#111827" stroke="#374151" stroke-width="1"/>
    <rect x="375" y="10" width="145" height="85" rx="8" fill="#1F2937"/>
    <text x="447" y="60" font-size="34" text-anchor="middle">📷</text>
    <text x="377" y="116" fill="#F3F4F6" font-family="sans-serif" font-size="12" font-weight="bold">4K Studio Camera</text>
    <text x="377" y="136" fill="#F472B6" font-family="sans-serif" font-size="13" font-weight="bold">$349.00</text>
    <rect x="377" y="145" width="141" height="22" rx="4" fill="#7C5CFC"/>
    <text x="447" y="160" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Add to Cart</text>
  </g>

  <!-- Bottom Checkout banner -->
  <g transform="translate(35, 292)">
    <rect width="530" height="42" rx="8" fill="#201538"/>
    <text x="25" y="26" fill="#E9D5FF" font-family="sans-serif" font-size="12">✨ Free Shipping on orders over $50 • Secure Stripe &amp; PayPal Checkout</text>
  </g>
</svg>
